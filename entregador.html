<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="robots" content="noindex">
<title>Entregador • Clube da Pizza</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css?v=20261022">
<style>
main{max-width:720px;padding-bottom:40px}
.topo .in{max-width:720px}
#login{max-width:380px;margin:40px auto}
#mapaRota{height:300px;border-radius:12px;border:1px solid var(--line);margin:8px 0}
.resumoRota{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.resumoRota div{background:#f5f5f4;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.resumoRota b{display:block;font-size:17px;color:var(--ink)}
.navs{display:flex;flex-direction:column;gap:6px}
.navs a{text-decoration:none;text-align:center;display:block}
.parada{background:#fff;border:1px solid var(--line);border-left:6px solid #2563eb;border-radius:14px;padding:12px;margin-bottom:12px}
.parada.feita{border-left-color:var(--ok);opacity:.7}
.parada.falhou{border-left-color:#dc2626;opacity:.7}
.parada .cab{display:flex;align-items:center;gap:10px}
.nOrdem{flex:0 0 34px;height:34px;border-radius:50%;background:#2563eb;color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center}
.parada .cab .num{font-size:19px;font-weight:900}
.parada .cab .km{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.parada .end{font-size:16px;font-weight:700;margin:8px 0 2px}
.parada .itens{font-size:13px;color:var(--muted);margin:6px 0}
.saches{background:#fef3c7;border-radius:8px;padding:5px 8px;font-weight:800;font-size:13px;margin:6px 0}
.cobrar{border-radius:10px;padding:10px;font-size:16px;font-weight:900;margin:8px 0;line-height:1.3}
.cobrar.dinheiro{background:#fef9c3;border:2px solid #facc15;color:#713f12}
.cobrar.cartao{background:#e0e7ff;border:2px solid #818cf8;color:#312e81}
.cobrar.pago{background:#dcfce7;border:2px solid #4ade80;color:#14532d}
.cobrar.pend{background:#fee2e2;border:2px solid #f87171;color:#7f1d1d}
.botoes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.botoes .btn,.botoes a{padding:10px 4px;font-size:13px;text-align:center;text-decoration:none;border-radius:10px}
.finais{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.finais .btn{padding:14px 8px;font-size:16px}
.btn.ok{background:var(--ok);color:#fff}
.pronto{display:flex;gap:10px;align-items:flex-start;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff}
.pronto.on{border-color:#2563eb;background:#eff6ff}
.pronto input{width:22px;height:22px;margin:2px 0 0;flex:0 0 22px}
.pronto .info{flex:1;min-width:0}
.marcador{background:#2563eb;color:#fff;border:2px solid #fff;border-radius:50%;width:28px!important;height:28px!important;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;box-shadow:0 1px 4px #0006}
.marcador.feito{background:#9ca3af}
.marcador.loja{background:#b91c1c;font-size:15px}
</style>
</head>
<body>
<header class="topo">
  <div class="in">
    <h1>🛵 Entregas <span id="quem" style="font-weight:400;font-size:14px;opacity:.85"></span></h1>
    <button class="btn sm sec hide" id="btnSair" onclick="DB.sair()">Sair</button>
  </div>
</header>

<main>
  <div id="avisoDemo" class="aviso hide">⚠️ <b>Modo demonstração:</b> só aparecem pedidos feitos neste mesmo navegador.</div>

  <div id="login" class="card hide">
    <h2>Acesso do entregador</h2>
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="username">
    <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password">
    <button class="btn full" style="margin-top:14px" onclick="entrar()">Entrar</button>
    <div id="erroLogin" class="muted" style="color:#b91c1c;margin-top:8px"></div>
  </div>

  <div id="painel" class="hide">
    <section id="secRota" class="hide">
      <div class="card">
        <h2>🗺️ Minha rota</h2>
        <div class="resumoRota" id="resumoRota"></div>
        <div id="mapaRota"></div>
        <div class="navs" id="navs"></div>
      </div>
      <div id="paradas"></div>
    </section>

    <section class="card">
      <h2>📦 Prontos para entrega <span class="muted" id="qtdProntos"></span></h2>
      <div id="prontos"></div>
      <button class="btn full dark hide" id="btnIniciar" style="margin-top:8px;padding:16px;font-size:17px" onclick="iniciarRota()"></button>
    </section>

    <details class="card" id="secFeitas">
      <summary style="font-weight:800;cursor:pointer">✅ Minhas entregas de hoje <span id="qtdFeitas"></span></summary>
      <div id="feitas" style="margin-top:10px"></div>
    </details>
  </div>
</main>

<!-- Não entregue -->
<div class="modal" id="modalNao" onclick="if(event.target===this)fecharNao()">
  <div class="box" id="naoConteudo"></div>
</div>

<div id="toast"></div>

<script src="js/config.js?v=20261022"></script>
<script src="js/cardapio.js?v=20261022"></script>
<script src="js/db.js?v=20261022"></script>
<script src="js/catalogo.js?v=20261022"></script>
<script src="js/rota.js?v=20261022"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let eu = null;                 // { nome, email }
let pedidos = [], marcados = new Set(), pararLista = null;
let mapa = null, camada = null;
let naoPedido = null, naoMotivo = null;
const MOTIVOS = ['Cliente ausente', 'Endereço não encontrado', 'Cliente recusou', 'Outro'];
const LOJA = CONFIG.entrega.localLoja;
const kmTxt = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km';
const lerAvisados = () => { try { return JSON.parse(localStorage.getItem('cdp_ent_avisados') || '[]'); } catch { return []; } };

if (DB.modo() === 'demo') document.getElementById('avisoDemo').classList.remove('hide');

/* ---------------- LOGIN ---------------- */
DB.observarUsuario(u => {
  const logado = !!u;
  document.getElementById('login').classList.toggle('hide', logado);
  document.getElementById('painel').classList.toggle('hide', !logado);
  document.getElementById('btnSair').classList.toggle('hide', !logado || DB.modo() === 'demo');
  if (logado) {
    // modo demo: usa o 1º entregador cadastrado em CONFIG.equipe
    const pessoa = DB.modo() === 'demo' ? (Equipe.entregadores()[0] || { nome: 'Entregador', email: 'demo' }) : Equipe.de(u.email);
    eu = { nome: pessoa.nome, email: pessoa.email };
    document.getElementById('quem').textContent = '• ' + eu.nome.split(' ')[0];
    assinar();
  } else {
    eu = null; document.getElementById('quem').textContent = '';
    if (pararLista) { pararLista(); pararLista = null; }
  }
});
async function entrar() {
  document.getElementById('erroLogin').textContent = '';
  try { await DB.login(document.getElementById('email').value.trim(), document.getElementById('senha').value); }
  catch (e) { document.getElementById('erroLogin').textContent = 'E-mail ou senha inválidos.'; }
}
document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

async function assinar() {
  if (pararLista) pararLista();
  pararLista = await DB.observarPedidosDoDia(Horario.dataTurno(), lista => { pedidos = lista; render(); },
    e => avisarErro(e));
}
setInterval(() => { if (eu && Horario.dataTurno() !== assinar.dia) { assinar.dia = Horario.dataTurno(); assinar(); } }, 60000);
assinar.dia = Horario.dataTurno();

/* ---------------- LISTAS ---------------- */
const meu = p => p.entregador && p.entregador.email === eu.email;
const prontos = () => pedidos.filter(p => p.status === 'pronto' && p.entrega.tipo === 'entrega').sort((a, b) => a.numero - b.numero);
const minhasPendentes = () => pedidos.filter(p => p.status === 'saiu' && p.entrega.tipo === 'entrega' && meu(p))
  .sort((a, b) => ((a.rota || {}).ordem || 99) - ((b.rota || {}).ordem || 99));
const minhasFeitas = () => pedidos.filter(p => ['entregue', 'nao_entregue'].includes(p.status) && meu(p))
  .sort((a, b) => (b.entregueEm || (b.naoEntregue || {}).em || 0) - (a.entregueEm || (a.naoEntregue || {}).em || 0));
const ponto = p => p.entrega.lat != null && p.entrega.lng != null ? [p.entrega.lat, p.entrega.lng] : null;
const endereco = e => `${e.rua}, ${e.numero}${e.bairro ? ' - ' + e.bairro : ''}`;
// texto para o Google Maps: coordenadas do pino ou o endereço digitado
const destino = p => ponto(p) ? ponto(p).join(',') : `${endereco(p.entrega)}, ${CONFIG.loja.cidade}`;

function render() {
  const pend = minhasPendentes(), feitas = minhasFeitas(), pr = prontos();
  for (const id of [...marcados]) if (!pr.some(p => p.id === id)) marcados.delete(id);

  // ---- rota em andamento ----
  document.getElementById('secRota').classList.toggle('hide', !pend.length);
  if (pend.length) renderRota(pend, feitas);
  else if (mapa) { mapa.remove(); mapa = null; }

  // ---- prontos para levar ----
  document.getElementById('qtdProntos').textContent = pr.length ? `(${pr.length})` : '';
  document.getElementById('prontos').innerHTML = pr.length ? pr.map(p => {
    const km = ponto(p) ? Rota.km(LOJA, ponto(p)) : null;
    return `<label class="pronto ${marcados.has(p.id) ? 'on' : ''}">
      <input type="checkbox" ${marcados.has(p.id) ? 'checked' : ''} onchange="marcar('${p.id}',this.checked)">
      <div class="info"><b>#${p.numero} ${esc(p.cliente.nome)}</b>${km != null ? ` <span class="muted">• ${kmTxt(km)}</span>` : ' <span class="tag pend" style="font-size:11px">SEM PINO</span>'}
        <div class="muted">📍 ${esc(endereco(p.entrega))}</div>
        <div style="font-size:13px;font-weight:700">${textoCobrar(p).curto}</div></div>
    </label>`;
  }).join('') : '<div class="muted">Nenhum pedido pronto agora. A lista atualiza sozinha.</div>';
  const b = document.getElementById('btnIniciar');
  b.classList.toggle('hide', !marcados.size);
  b.textContent = pend.length ? `➕ Adicionar ${marcados.size} à rota e reorganizar` : `🛵 Iniciar rota (${marcados.size} pedido${marcados.size > 1 ? 's' : ''})`;

  // ---- feitas ----
  document.getElementById('qtdFeitas').textContent = `(${feitas.length})`;
  document.getElementById('feitas').innerHTML = feitas.length ? feitas.map(p => `<div class="linha" style="border-bottom:1px solid var(--line)">
      <span>${p.status === 'entregue' ? '✅' : '❌'} <b>#${p.numero}</b> ${esc(p.cliente.nome)}${p.status === 'nao_entregue' && p.naoEntregue ? `<br><span class="muted">${esc(p.naoEntregue.motivo)}</span>` : ''}</span>
      <span class="muted">${p.entregueEm ? new Date(p.entregueEm).toLocaleTimeString('pt-BR').slice(0, 5) : ''}</span></div>`).join('')
    : '<div class="muted">Nenhuma ainda.</div>';
}
function marcar(id, on) { if (on) marcados.add(id); else marcados.delete(id); render(); }

/* ---------------- VALOR A COBRAR ---------------- */
function textoCobrar(p) {
  const pg = p.pagamento, t = dinheiro(p.total);
  if (pg.forma === 'dinheiro') {
    const longo = pg.trocoPara && pg.trocoPara > p.total
      ? `💵 Cobrar ${t} – levar troco para ${dinheiro(pg.trocoPara)} (troco ${dinheiro(pg.trocoPara - p.total)})`
      : `💵 Cobrar ${t} em dinheiro (sem troco)`;
    return { classe: 'dinheiro', longo, curto: `💵 Cobrar ${t}${pg.trocoPara ? ' • troco ' + dinheiro(pg.trocoPara - p.total) : ''}` };
  }
  if (pg.forma === 'cartao') return { classe: 'cartao', longo: `💳 Cartão na entrega ${t} — levar a maquininha`, curto: `💳 Cartão ${t}` };
  if (pg.confirmado) return { classe: 'pago', longo: '✅ Já pago no Pix — não cobrar', curto: '✅ Pago no Pix' };
  return { classe: 'pend', longo: `⚠️ Pix NÃO confirmado — ligue para a loja antes de entregar (${t})`, curto: `⚠️ Pix não confirmado ${t}` };
}

/* ---------------- ROTA ---------------- */
async function iniciarRota() {
  const sel = prontos().filter(p => marcados.has(p.id));
  if (!sel.length) return toast('Marque os pedidos que você vai levar.');
  const todos = minhasPendentes().concat(sel);
  // melhor sequência saindo da pizzaria; pedidos sem pino vão no fim
  const comPino = todos.filter(ponto), semPino = todos.filter(p => !ponto(p));
  const ordem = Rota.otimizar(LOJA, comPino.map(ponto));
  const seq = ordem.map(i => comPino[i]).concat(semPino);
  const rotaId = 'r' + Date.now().toString(36), agora = Date.now();
  const b = document.getElementById('btnIniciar');
  b.disabled = true; b.textContent = 'Salvando rota...';
  try {
    for (let i = 0; i < seq.length; i++) {
      const p = seq[i], novo = p.status === 'pronto';
      const campos = { rota: { id: rotaId, ordem: i + 1 }, entregador: eu };
      if (novo) Object.assign(campos, { status: 'saiu', saiuEm: agora });
      await DB.atualizarPedido(p.id, campos, novo ? 'saiu' : null);
    }
    marcados.clear();
    toast('Rota pronta! Avise cada cliente no botão 💬 Avisar saída.');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { avisarErro(e); }
  finally { b.disabled = false; render(); }
}

function renderRota(pend, feitas) {
  const rotaId = (pend[0].rota || {}).id;
  const feitasRota = feitas.filter(p => p.rota && p.rota.id === rotaId);
  // distância estimada (linha reta) parada a parada
  let at = feitasRota.length ? null : LOJA, total = 0;
  const trechos = pend.map(p => {
    const pt = ponto(p);
    const d = at && pt ? Rota.km(at, pt) : null;
    if (d != null) total += d;
    if (pt) at = pt;
    return d;
  });
  const dinheiroReceber = pend.filter(p => p.pagamento.forma === 'dinheiro').reduce((s, p) => s + p.total, 0);
  const troco = pend.filter(p => p.pagamento.forma === 'dinheiro' && p.pagamento.trocoPara > p.total).reduce((s, p) => s + (p.pagamento.trocoPara - p.total), 0);
  document.getElementById('resumoRota').innerHTML = `
    <div><b>${pend.length}</b>parada${pend.length > 1 ? 's' : ''}</div>
    <div><b>${dinheiro(dinheiroReceber)}</b>em dinheiro</div>
    <div><b>${dinheiro(troco)}</b>levar de troco</div>`;

  // navegação pelas ruas (Google Maps): da pizzaria ou, com a rota em andamento, da localização atual
  const links = Rota.linksGoogle(pend.map(destino), feitasRota.length ? null : LOJA.join(','));
  document.getElementById('navs').innerHTML = links.map(l => `<a class="btn dark" target="_blank" href="${l.url}">🧭 Navegar${links.length > 1 ? ` — trecho paradas ${l.de} a ${l.ate}` : ''} (${l.ate - l.de + 1} parada${l.ate > l.de ? 's' : ''})</a>`).join('') +
    `<div class="muted" style="text-align:center">≈ ${kmTxt(total)} em linha reta${feitasRota.length ? ' a partir da 1ª parada pendente' : ' saindo da pizzaria'}</div>`;

  const avisados = lerAvisados();
  document.getElementById('paradas').innerHTML = pend.map((p, i) => {
    const e = p.entrega, c = textoCobrar(p), sc = Preco.saches(p.itens, p.cortesiaPorPizza || 0);
    const av = avisados.includes(p.id);
    return `<div class="parada">
      <div class="cab"><span class="nOrdem">${i + 1}</span><span class="num">#${p.numero}</span><b>${esc(p.cliente.nome)}</b>
        <span class="km">${trechos[i] != null ? '📏 ' + kmTxt(trechos[i]) : ponto(p) ? '' : '⚠️ sem pino'}</span></div>
      <div class="end">📍 ${esc(endereco(e))}</div>
      ${e.complemento ? `<div>🏠 ${esc(e.complemento)}</div>` : ''}
      ${e.referencia ? `<div class="muted">👀 Ref.: ${esc(e.referencia)}</div>` : ''}
      <div class="itens">${p.itens.filter(it => !Preco.ehSache(it)).map(it => `${it.qtd}x ${esc(Preco.descricao(it))}`).join(' • ')}</div>
      ${sc.qtd ? `<div class="saches">🥫 SACHÊS: ${esc(Preco.listaSaches(p.itens))}</div>` : ''}
      ${p.obs ? `<div class="aviso" style="margin:4px 0">📝 ${esc(p.obs)}</div>` : ''}
      <div class="cobrar ${c.classe}">${c.longo}</div>
      <div class="botoes">
        <a class="btn sec" href="tel:${esc(p.cliente.telefone)}">📞 Ligar</a>
        <a class="btn ${av ? 'sec' : 'wa'}" target="_blank" href="${linkWhats(p.cliente.telefone, STATUS.mensagem(p, 'saiu'))}" onclick="avisado('${p.id}')">${av ? '✔ Avisado' : '💬 Avisar saída'}</a>
        <a class="btn sec" target="_blank" href="${linkWhats(p.cliente.telefone, '')}">💬 Whats</a>
        <a class="btn sec" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino(p))}&travelmode=driving">🧭 Ir</a>
      </div>
      <div class="finais">
        <button class="btn ok" onclick="entregue('${p.id}')">✅ Entregue</button>
        <button class="btn" onclick="abrirNao('${p.id}')">❌ Não entregue</button>
      </div>
    </div>`;
  }).join('');
  desenharMapa(pend, feitasRota);
}
function avisado(id) {
  const l = lerAvisados();
  if (!l.includes(id)) { l.push(id); localStorage.setItem('cdp_ent_avisados', JSON.stringify(l.slice(-200))); }
  setTimeout(render, 300);
}

function desenharMapa(pend, feitas) {
  const el = document.getElementById('mapaRota');
  if (typeof L === 'undefined') { el.classList.add('hide'); return; }
  if (!mapa) {
    mapa = L.map(el);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
    camada = L.layerGroup().addTo(mapa);
  }
  camada.clearLayers();
  const icone = (txt, cls) => L.divIcon({ className: '', html: `<div class="marcador ${cls || ''}">${txt}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
  L.marker(LOJA, { icon: icone('🍕', 'loja') }).addTo(camada).bindTooltip(CONFIG.loja.nome);
  feitas.filter(ponto).forEach(p => L.marker(ponto(p), { icon: icone('✓', 'feito') }).addTo(camada).bindTooltip(`#${p.numero} ${p.cliente.nome}`));
  const linha = [LOJA];
  pend.forEach((p, i) => {
    if (!ponto(p)) return;
    linha.push(ponto(p));
    L.marker(ponto(p), { icon: icone(i + 1) }).addTo(camada).bindTooltip(`${i + 1}. #${p.numero} ${p.cliente.nome}`);
  });
  L.polyline(linha, { color: '#2563eb', weight: 4, opacity: .8, dashArray: '8 6' }).addTo(camada);
  setTimeout(() => { mapa.invalidateSize(); mapa.fitBounds(L.latLngBounds(linha).pad(0.15), { maxZoom: 17 }); }, 50);
}

/* ---------------- ENTREGUE / NÃO ENTREGUE ---------------- */
const achar = id => pedidos.find(p => p.id === id);
async function entregue(id) {
  const p = achar(id); if (!p) return;
  if (!confirm(`Confirmar ENTREGA do pedido #${p.numero} (${p.cliente.nome})?${p.pagamento.forma === 'dinheiro' ? `\n\n💵 Recebeu ${dinheiro(p.total)}?` : p.pagamento.forma === 'cartao' ? `\n\n💳 Passou ${dinheiro(p.total)} no cartão?` : ''}`)) return;
  const jan = p.cliente.telefone ? window.open('', '_blank') : null;   // abre já no clique (pop-up)
  try {
    await DB.atualizarPedido(id, { status: 'entregue', entregueEm: Date.now() }, 'entregue');
    if (jan) jan.location.href = linkWhats(p.cliente.telefone, STATUS.mensagem(Object.assign({}, p, { status: 'entregue' }), 'entregue'));
    toast(`✅ #${p.numero} entregue!`);
  } catch (e) { if (jan) jan.close(); avisarErro(e); }
}

function abrirNao(id) { naoPedido = achar(id); naoMotivo = null; renderNao(); document.getElementById('modalNao').classList.add('on'); }
function fecharNao() { document.getElementById('modalNao').classList.remove('on'); }
function renderNao() {
  const p = naoPedido, obs = (document.getElementById('naoObs') || {}).value || '';
  document.getElementById('naoConteudo').innerHTML = `
    <h2>❌ Não entregue — #${p.numero}</h2>
    <div class="muted">${esc(p.cliente.nome)} • ${esc(endereco(p.entrega))}</div>
    <h3 style="margin-top:12px">Motivo</h3>
    <div class="opcoes">${MOTIVOS.map(m => `<div class="opcao ${naoMotivo === m ? 'on' : ''}" onclick="naoMotivo='${m}';renderNao()">${m}</div>`).join('')}</div>
    <label for="naoObs">Observação ${naoMotivo === 'Outro' ? '<span style="color:var(--brand)">(obrigatória)</span>' : '(opcional)'}</label>
    <textarea id="naoObs" placeholder="Ex.: ninguém atendeu, liguei 2x">${esc(obs)}</textarea>
    <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="naoAvisar" style="width:auto" checked> Avisar o cliente no WhatsApp</label>
    <button class="btn full" style="margin-top:12px;padding:14px" onclick="salvarNao()">Confirmar não entregue</button>
    <button class="btn sec full" style="margin-top:8px" onclick="fecharNao()">Voltar</button>`;
}
async function salvarNao() {
  const p = naoPedido, obs = document.getElementById('naoObs').value.trim();
  if (!naoMotivo) return toast('Escolha o motivo.');
  if (naoMotivo === 'Outro' && !obs) return toast('Descreva o motivo na observação.');
  const naoEntregue = { motivo: naoMotivo, obs, em: Date.now(), entregador: eu.nome };
  const jan = document.getElementById('naoAvisar').checked && p.cliente.telefone ? window.open('', '_blank') : null;
  try {
    await DB.atualizarPedido(p.id, {
      status: 'nao_entregue', naoEntregue,
      falhas: (p.falhas || []).concat([{ motivo: naoMotivo, obs, em: naoEntregue.em, entregador: eu }])
    }, 'nao_entregue');
    if (jan) jan.location.href = linkWhats(p.cliente.telefone, STATUS.mensagem(Object.assign({}, p, { naoEntregue }), 'nao_entregue'));
    fecharNao();
    toast(`Pedido #${p.numero} marcado como NÃO entregue. Leve de volta à loja.`);
  } catch (e) { if (jan) jan.close(); avisarErro(e); }
}

// Erro ao gravar: mensagem clara (funciona mesmo se o db.js em cache for de outra versão)
function avisarErro(e) {
  if (window.DB && DB.mensagemErro) { DB.logErro(e); toast(DB.mensagemErro(e)); return; }
  console.error(e); toast('Página desatualizada: aperte Ctrl+F5 (no celular, feche e abra o navegador).');
}
function toast(t) {
  const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3200);
}
Catalogo.iniciar(() => { if (eu && pedidos.length) render(); });
</script>
</body>
</html>
