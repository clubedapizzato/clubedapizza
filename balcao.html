<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="robots" content="noindex">
<title>Balcão • Clube da Pizza</title>
<link rel="stylesheet" href="css/app.css">
<style>
main{max-width:1400px;padding-bottom:30px}
.topo .in{max-width:1400px}
.ferramentas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#login{max-width:380px;margin:40px auto}
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
@media(max-width:900px){.pdv{grid-template-columns:1fr}}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.cat{border:2px solid var(--dark);background:#fff;border-radius:14px;padding:14px 8px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.cat.on{background:var(--dark);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;min-height:104px;border:1px solid var(--line);border-bottom:4px solid var(--brand);background:#fff;border-radius:14px;padding:12px;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px;box-shadow:0 1px 3px #0001}
.tile:active{transform:scale(.97);background:#fef2f2}
.tile b{font-size:15px;line-height:1.2}
.tile .pr{font-size:13px;color:var(--muted)}
.tile .pouco{font-size:12px;font-weight:800;color:var(--warn)}
.tile.esgotado{opacity:.45;cursor:not-allowed}
.sachesRap{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.sachesRap .chip{padding:9px 11px;font-size:14px}
.tile .badge{position:absolute;top:-8px;right:-6px;background:var(--brand);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.painel{position:sticky;top:64px}
.painel .card{margin-bottom:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .d{font-weight:700;font-size:14px}
.qty button{width:40px;height:40px;font-size:20px}
.opcao{padding:14px 8px;font-size:16px}
.grande{font-size:20px;padding:18px}
.totalPdv{display:flex;justify-content:space-between;font-size:24px;font-weight:900;margin:4px 0 10px}
.rapidos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rapidos .btn{flex:1}
.troco{font-size:20px;font-weight:900;color:var(--ok);margin-top:8px}
.prontos{display:flex;gap:8px;flex-wrap:wrap}
.pchip{border-radius:12px;padding:8px 12px;font-weight:800;background:#f5f5f4;border:1px solid var(--line);font-size:14px}
.pchip.saiu{background:#dcfce7;border-color:#86efac;color:#14532d}
.pchip.producao{background:#fef3c7;border-color:#fde68a}
#sucesso .box{text-align:center}
#sucesso .numero{font-size:96px;font-weight:900;line-height:1;margin:10px 0;color:var(--brand)}
.modal .box{max-width:720px}
.chips .chip{padding:12px 14px;font-size:15px}
#barraMob{display:none}
@media(max-width:900px){#barraMob{display:block}main{padding-bottom:100px}.painel{position:static}}
</style>
</head>
<body>
<header class="topo">
  <div class="in">
    <h1>🏪 Balcão <span id="relogio" style="font-weight:400;font-size:14px;opacity:.8"></span></h1>
    <div class="ferramentas hide" id="ferramentas">
      <a class="btn sm sec" style="text-decoration:none" href="cozinha.html" target="_blank">👨‍🍳 Cozinha</a>
      <button class="btn sm sec hide" id="btnSair" onclick="DB.sair()">Sair</button>
    </div>
  </div>
</header>

<main>
  <div id="avisoDemo" class="aviso hide">⚠️ <b>Modo demonstração:</b> os pedidos só aparecem na cozinha aberta neste mesmo navegador. Configure o Firebase em <code>js/config.js</code>.</div>

  <div id="login" class="card hide">
    <h2>Acesso do balcão</h2>
    <div class="muted">Use o mesmo login da cozinha.</div>
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="username">
    <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password">
    <button class="btn full" style="margin-top:14px" onclick="entrar()">Entrar</button>
    <div id="erroLogin" class="muted" style="color:#b91c1c;margin-top:8px"></div>
  </div>

  <div id="pdv" class="pdv hide">
    <section>
      <div id="andamento" class="card hide" style="padding:10px 12px">
        <h3>🔔 Pedidos do balcão em andamento</h3>
        <div class="prontos" id="prontos"></div>
      </div>
      <div class="cats" id="cats"></div>
      <div class="tiles" id="tiles"></div>
    </section>

    <aside class="painel" id="painelPedido">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">🧾 Pedido</h2>
          <button class="btn sm sec" onclick="limpar()">Limpar</button>
        </div>
        <div id="itens"></div>
        <div class="sachesRap hide" id="sachesRap"></div>
      </div>

      <div class="card">
        <label for="nome" style="margin-top:0">Nome do cliente <span class="muted">(opcional — para chamar)</span></label>
        <input id="nome" autocomplete="off" placeholder="Ex.: João">
        <h3 style="margin-top:14px">Consumo</h3>
        <div class="opcoes" id="opConsumo"></div>
        <h3 style="margin-top:14px">Pagamento</h3>
        <div class="opcoes" id="opPagamento"></div>
        <div id="blocoDinheiro" class="hide">
          <label for="recebido">Valor recebido</label>
          <input id="recebido" inputmode="decimal" placeholder="Ex.: 100" oninput="renderTotal()">
          <div class="rapidos" id="rapidos"></div>
          <div class="troco" id="troco"></div>
        </div>
        <label for="obs">Observação</label>
        <input id="obs" placeholder="Ex.: sem cebola na metade calabresa">
      </div>

      <div class="card">
        <div class="totalPdv"><span>TOTAL</span><span id="total">R$ 0,00</span></div>
        <button class="btn full grande" id="btnFinalizar" onclick="finalizar()">Finalizar pedido</button>
      </div>
    </aside>
  </div>
</main>

<div class="barra" id="barraMob">
  <div class="in"><button class="btn full" id="btnMob" onclick="document.getElementById('painelPedido').scrollIntoView({behavior:'smooth'})"></button></div>
</div>

<!-- Modal montar pizza -->
<div class="modal" id="modalPizza" onclick="if(event.target===this)fecharModal()">
  <div class="box" id="modalConteudo"></div>
</div>

<!-- Pedido finalizado -->
<div class="modal" id="sucesso">
  <div class="box" id="sucessoConteudo"></div>
</div>

<pre id="ticketPrint" class="print-only"></pre>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/cardapio.js"></script>
<script src="js/db.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/impressora.js"></script>
<script>
const C = CARDAPIO;
let carrinho = [];
let categoria = 'pizzas';
let consumo = null;            // 'local' | 'levar'
let forma = null;              // 'pix' | 'dinheiro' | 'cartao'
let enviando = false, ultimo = null, pararLista = null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const val = id => document.getElementById(id).value.trim();
const numero = t => parseFloat(String(t).replace(/[^\d,.]/g, '').replace(',', '.')) || 0;

if (DB.modo() === 'demo') document.getElementById('avisoDemo').classList.remove('hide');
const relogio = () => document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR').slice(0, 5);
relogio(); setInterval(relogio, 30000);

/* ---------------- LOGIN (mesmo da cozinha) ---------------- */
DB.observarUsuario(u => {
  if (u && Equipe.de(u.email).papel === 'entregador') return location.replace('entregador.html');
  const logado = !!u;
  document.getElementById('login').classList.toggle('hide', logado);
  document.getElementById('pdv').classList.toggle('hide', !logado);
  document.getElementById('ferramentas').classList.toggle('hide', !logado);
  document.getElementById('btnSair').classList.toggle('hide', !logado || DB.modo() === 'demo');
  document.getElementById('barraMob').classList.toggle('hide', !logado);
  if (logado) assinar(); else if (pararLista) { pararLista(); pararLista = null; }
});
async function entrar() {
  document.getElementById('erroLogin').textContent = '';
  try { await DB.login(val('email'), document.getElementById('senha').value); }
  catch (e) { document.getElementById('erroLogin').textContent = 'E-mail ou senha inválidos.'; }
}
document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

// Pedidos do balcão de hoje que ainda não foram entregues (para chamar o cliente)
async function assinar() {
  if (pararLista) pararLista();
  pararLista = await DB.observarPedidosDoDia(hojeISO(), lista => {
    const ativos = lista.filter(p => p.origem === 'balcao' && ['novo', 'producao', 'saiu'].includes(p.status)).sort((a, b) => a.numero - b.numero);
    document.getElementById('andamento').classList.toggle('hide', !ativos.length);
    document.getElementById('prontos').innerHTML = ativos.map(p =>
      `<span class="pchip ${p.status}">#${p.numero}${p.cliente.nome ? ' ' + esc(p.cliente.nome) : ''} • ${p.status === 'saiu' ? '✅ PRONTO' : esc(STATUS.rotulo(p.status, 'balcao'))}</span>`).join('');
  });
}

/* ---------------- PRODUTOS ---------------- */
function renderCats() {
  const vitrine = Catalogo.categoriasVenda();
  if (categoria !== 'pizzas' && !vitrine.some(c => c.id === categoria)) categoria = 'pizzas';
  const cats = [{ id: 'pizzas', nome: '🍕 Pizzas' }].concat(vitrine.map(c => ({ id: c.id, nome: c.nome })));
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<button class="cat ${c.id === categoria ? 'on' : ''}" onclick="categoria='${c.id}';renderCats();renderTiles()">${esc(c.nome)}</button>`).join('');
}
function renderTiles() {
  let h = '';
  if (categoria === 'pizzas') {
    Catalogo.saboresAtivos().forEach(({ s, i }) => {
      const q = carrinho.filter(x => x.tipo === 'pizza' && x.sabores.includes(s.nome)).reduce((a, x) => a + x.qtd, 0);
      h += `<button class="tile" onclick="abrirPizza(${i})">${q ? `<span class="badge">${q}</span>` : ''}
        <b>${esc(s.nome)}</b><span class="pr">${C.tamanhos.map(t => `${t.id} ${dinheiro(s[t.id])}`).join(' • ')}</span></button>`;
    });
  } else {
    const cat = Catalogo.categoriasVenda().find(c => c.id === categoria);
    (cat ? cat.produtos : []).forEach(p => {
      const it = carrinho.find(x => x.tipo === 'produto' && x.id === p.id), n = Catalogo.disponivel(p.id);
      h += `<button class="tile" onclick="alterarProduto('${p.id}',1)">${it ? `<span class="badge">${it.qtd}</span>` : ''}
        <b>${esc(p.nome)}</b><span class="pr">${dinheiro(p.preco)}</span>${n <= 5 ? `<span class="pouco">Só restam ${n}</span>` : ''}</button>`;
    });
  }
  document.getElementById('tiles').innerHTML = h;
}
const qtdProduto = id => { const it = carrinho.find(x => x.tipo === 'produto' && x.id === id); return it ? it.qtd : 0; };
// Botões rápidos de sachês no pedido
function renderSaches() {
  const lista = Catalogo.sachesVenda(), el = document.getElementById('sachesRap');
  el.classList.toggle('hide', !lista.length);
  const porPizza = C.loja.cortesiaSachesPorPizza || 0;
  el.innerHTML = `<span class="muted" style="width:100%">🥫 Sachês${porPizza ? ` • ${porPizza} grátis por pizza` : ''}</span>` +
    lista.map(p => `<span class="chip" onclick="alterarProduto('${p.id}',1)">+ ${esc(p.nome)} <span class="muted">${dinheiro(p.preco)}</span></span>`).join('');
}
function alterarProduto(id, d) {
  if (d > 0 && qtdProduto(id) + d > Catalogo.disponivel(id)) return toast(`Só restam ${Catalogo.disponivel(id)} de ${Preco.descricao({ tipo: 'produto', id })}.`);
  let it = carrinho.find(x => x.tipo === 'produto' && x.id === id);
  if (!it && d > 0) { it = { uid: uid(), tipo: 'produto', id, qtd: 0 }; carrinho.push(it); }
  if (!it) return;
  it.qtd += d;
  if (it.qtd <= 0) carrinho = carrinho.filter(x => x !== it);
  atualizar();
}

/* ---------------- MONTAR PIZZA ---------------- */
let montagem = null;
function abrirPizza(iSabor) {
  montagem = { tamanho: 'G', sabores: [C.sabores[iSabor].nome], adicional: false, qtd: 1, obs: '' };
  renderModal();
  document.getElementById('modalPizza').classList.add('on');
}
function fecharModal() { document.getElementById('modalPizza').classList.remove('on'); }
function renderModal() {
  const m = montagem, t = Preco.tamanho(m.tamanho);
  const preco = Preco.pizza(m.tamanho, m.sabores, m.adicional);
  document.getElementById('modalConteudo').innerHTML = `
    <h2>🍕 Montar pizza</h2>
    <div class="opcoes">${C.tamanhos.map(x => `<div class="opcao ${x.id === m.tamanho ? 'on' : ''}" onclick="mTamanho('${x.id}')">${x.nome} (${x.id})<small>${x.maxSabores === 1 ? '1 sabor' : 'até ' + x.maxSabores + ' sabores'}</small></div>`).join('')}</div>
    <h3 style="margin-top:14px">Sabores <span class="muted">(${m.sabores.length}/${t.maxSabores})</span></h3>
    <div class="chips">${Catalogo.saboresAtivos().map(({ s, i }) => `<span class="chip ${m.sabores.includes(s.nome) ? 'on' : ''}" onclick="mSabor(${i})">${esc(s.nome)} • ${dinheiro(s[m.tamanho])}</span>`).join('')}</div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:700;font-size:15px">
      <input type="checkbox" style="width:22px;height:22px" ${m.adicional ? 'checked' : ''} onchange="montagem.adicional=this.checked;renderModal()">
      Adicional ${esc(C.nomeAdicional)} (+${dinheiro(t.adicional)})
    </label>
    <label for="mObs">Observação desta pizza</label>
    <input id="mObs" value="${esc(m.obs)}" placeholder="Ex.: sem cebola" oninput="montagem.obs=this.value">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px">
      <div class="qty"><button onclick="montagem.qtd=Math.max(1,montagem.qtd-1);renderModal()">−</button><b>${m.qtd}</b><button onclick="montagem.qtd++;renderModal()">+</button></div>
      <button class="btn grande" style="flex:1" ${m.sabores.length ? '' : 'disabled'} onclick="adicionarPizza()">Adicionar • ${dinheiro(preco * m.qtd)}</button>
    </div>
    <button class="btn sec full" style="margin-top:8px" onclick="fecharModal()">Cancelar</button>`;
}
function mTamanho(id) {
  montagem.tamanho = id;
  montagem.sabores = montagem.sabores.slice(0, Preco.tamanho(id).maxSabores);
  renderModal();
}
function mSabor(i) {
  const nome = C.sabores[i].nome, m = montagem, max = Preco.tamanho(m.tamanho).maxSabores;
  if (m.sabores.includes(nome)) m.sabores = m.sabores.filter(s => s !== nome);
  else if (max === 1) m.sabores = [nome];
  else if (m.sabores.length >= max) { toast(`Máximo de ${max} sabores neste tamanho.`); return; }
  else m.sabores.push(nome);
  renderModal();
}
function adicionarPizza() {
  if (!montagem.sabores.length) return;
  carrinho.push(Object.assign({ uid: uid(), tipo: 'pizza' }, montagem, { obs: montagem.obs.trim() }));
  fecharModal();
  atualizar();
}

/* ---------------- PEDIDO ---------------- */
function alterarItem(u, d) {
  const it = carrinho.find(x => x.uid === u);
  if (!it) return;
  if (d > 0 && it.tipo === 'produto' && it.qtd + d > Catalogo.disponivel(it.id)) return toast(`Só restam ${Catalogo.disponivel(it.id)} de ${Preco.descricao(it)}.`);
  it.qtd += d;
  if (it.qtd <= 0) carrinho = carrinho.filter(x => x !== it);
  atualizar();
}
function renderItens() {
  const sc = Preco.saches(carrinho);
  document.getElementById('itens').innerHTML = carrinho.length ? carrinho.map((it, i) => `
    <div class="item">
      <div><div class="d">${Preco.ehSache(it) ? '🥫 Sachê ' : ''}${esc(Preco.descricao(it))}</div>
        ${it.obs ? `<div class="muted">Obs: ${esc(it.obs)}</div>` : ''}
        <div class="muted">${dinheiro(Preco.unitario(it) * (it.qtd - (sc.gratisPorItem[i] || 0)))}${sc.gratisPorItem[i] ? ` • ${sc.gratisPorItem[i]} cortesia` : ''}</div></div>
      <div class="qty"><button onclick="alterarItem('${it.uid}',-1)">−</button><b>${it.qtd}</b><button onclick="alterarItem('${it.uid}',1)">+</button></div>
    </div>`).join('') + (sc.qtd ? `<div class="linha" style="font-weight:700"><span>Sachês: ${sc.qtd}${sc.gratis ? ` (${sc.gratis} cortesia)` : ''}</span><span>${dinheiro(sc.valor)}</span></div>` : '')
    : '<div class="muted" style="padding:10px 0">Toque nos produtos para adicionar.</div>';
}
function renderOpcoes() {
  const opc = (lista, atual, fn) => lista.map(o => `<div class="opcao ${atual === o.id ? 'on' : ''}" onclick="${fn}('${o.id}')">${o.nome}</div>`).join('');
  document.getElementById('opConsumo').innerHTML = opc([{ id: 'local', nome: '🍽️ Comer aqui' }, { id: 'levar', nome: '🥡 Para levar' }], consumo, 'setConsumo');
  document.getElementById('opPagamento').innerHTML = opc([{ id: 'pix', nome: '⚡ Pix' }, { id: 'dinheiro', nome: '💵 Dinheiro' }, { id: 'cartao', nome: '💳 Cartão' }], forma, 'setForma');
  document.getElementById('blocoDinheiro').classList.toggle('hide', forma !== 'dinheiro');
}
function setConsumo(c) { consumo = c; renderOpcoes(); }
function setForma(f) { forma = f; renderOpcoes(); renderTotal(); }
function setRecebido(v) { document.getElementById('recebido').value = v ? String(v).replace('.', ',') : ''; renderTotal(); }

function renderTotal() {
  const total = Preco.subtotal(carrinho), n = carrinho.reduce((s, x) => s + x.qtd, 0);
  document.getElementById('total').textContent = dinheiro(total);
  document.getElementById('btnFinalizar').textContent = `Finalizar pedido • ${dinheiro(total)}`;
  document.getElementById('btnFinalizar').disabled = !n;
  document.getElementById('btnMob').textContent = n ? `Ver pedido (${n}) • ${dinheiro(total)}` : 'Toque nos produtos';
  document.getElementById('btnMob').disabled = !n;
  if (forma === 'dinheiro') {
    const notas = [...new Set([Math.ceil(total / 10) * 10, 50, 100, 200].filter(v => v > total))].sort((a, b) => a - b).slice(0, 3);
    document.getElementById('rapidos').innerHTML = `<button class="btn sm sec" onclick="setRecebido(${total})">Exato</button>` +
      notas.map(v => `<button class="btn sm sec" onclick="setRecebido(${v})">${dinheiro(v)}</button>`).join('');
    const rec = numero(val('recebido'));
    document.getElementById('troco').innerHTML = !rec ? '' : rec < total
      ? `<span style="color:var(--brand)">Faltam ${dinheiro(total - rec)}</span>` : `Troco: ${dinheiro(rec - total)}`;
  }
}
function atualizar() { renderTiles(); renderItens(); renderSaches(); renderTotal(); }

async function finalizar() {
  if (enviando) return;
  if (!carrinho.length) return toast('Adicione pelo menos um produto.');
  if (!consumo) return toast('Escolha: Comer aqui ou Para levar.');
  if (!forma) return toast('Escolha a forma de pagamento.');
  const falta = Catalogo.faltas(carrinho)[0];
  if (falta) return toast(falta.tem ? `Só restam ${falta.tem} de ${falta.nome}.` : `${falta.nome} sem estoque.`);
  const total = Preco.subtotal(carrinho);
  let trocoPara = null;
  if (forma === 'dinheiro' && val('recebido')) {
    trocoPara = numero(val('recebido'));
    if (trocoPara < total) return toast('Valor recebido menor que o total.');
  }

  const pedido = {
    origem: 'balcao',
    data: hojeISO(),
    agendadoPara: null,
    cliente: { nome: val('nome'), telefone: '' },
    entrega: { tipo: 'balcao', consumo },
    itens: Catalogo.itensPedido(carrinho),
    cortesiaPorPizza: C.loja.cortesiaSachesPorPizza || 0,
    subtotal: total, taxaEntrega: 0, total,
    pagamento: { forma, trocoPara, confirmado: true },
    obs: val('obs')
  };

  enviando = true;
  const b = document.getElementById('btnFinalizar');
  b.disabled = true; b.textContent = 'Enviando...';
  try {
    // balcão: baixa o estoque na hora, junto com a criação do pedido
    const { numero: n } = await DB.criarPedido(pedido, { baixarEstoque: true });
    ultimo = Object.assign({}, pedido, { numero: n, criadoEm: Date.now() });
    mostrarSucesso();
  } catch (e) {
    console.error(e);
    toast('Não foi possível enviar. Verifique a internet/login e tente de novo.');
    renderTotal();
  } finally { enviando = false; }
}

function mostrarSucesso() {
  const p = ultimo, pg = p.pagamento;
  document.getElementById('sucessoConteudo').innerHTML = `
    <div class="muted" style="font-size:16px">✅ Pedido enviado para a cozinha</div>
    <div class="numero">#${p.numero}</div>
    ${p.cliente.nome ? `<div style="font-size:20px;font-weight:800">${esc(p.cliente.nome)}</div>` : ''}
    <div style="font-size:16px;margin:6px 0">${p.entrega.consumo === 'local' ? '🍽️ Comer aqui' : '🥡 Para levar'} • ${({ pix: '⚡ Pix', dinheiro: '💵 Dinheiro', cartao: '💳 Cartão' })[pg.forma]}</div>
    <div class="totalPdv" style="justify-content:center;gap:12px"><span>Total</span><span>${dinheiro(p.total)}</span></div>
    ${pg.forma === 'dinheiro' && pg.trocoPara ? `<div class="troco" style="font-size:26px">Recebido ${dinheiro(pg.trocoPara)} → Troco ${dinheiro(pg.trocoPara - p.total)}</div>` : ''}
    <button class="btn full grande" style="margin-top:16px" onclick="novoPedido()">➕ Novo pedido</button>
    <button class="btn sec full" style="margin-top:8px" onclick="Impressora.imprimir(ultimo)">🖨️ Imprimir cópia aqui</button>`;
  document.getElementById('sucesso').classList.add('on');
}

function limpar() {
  carrinho = []; consumo = null; forma = null;
  ['nome', 'obs', 'recebido'].forEach(id => document.getElementById(id).value = '');
  renderOpcoes(); atualizar();
}
function novoPedido() {
  document.getElementById('sucesso').classList.remove('on');
  limpar();
  categoria = 'pizzas'; renderCats(); renderTiles();
  window.scrollTo(0, 0);
}

function toast(t) {
  const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2800);
}

renderCats(); renderOpcoes(); atualizar();
Catalogo.iniciar(() => { renderCats(); atualizar(); if (document.getElementById('modalPizza').classList.contains('on')) renderModal(); });
</script>
</body>
</html>
