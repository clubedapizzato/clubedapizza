<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="robots" content="noindex">
<title>Cozinha • Clube da Pizza</title>
<link rel="stylesheet" href="css/app.css?v=20261025">
<style>
main{max-width:1400px;padding-bottom:30px}
.topo .in{max-width:1400px;flex-wrap:wrap}
.ferramentas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ferramentas .btn{padding:7px 10px;font-size:13px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;background:#ffffff14;border-radius:9px;padding:6px 10px;cursor:pointer;user-select:none}
.toggle input{width:auto;margin:0}
.colunas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1100px){.colunas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.colunas{grid-template-columns:1fr}}
.coluna h2{display:flex;justify-content:space-between;align-items:center;font-size:15px;background:var(--dark);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.coluna h2 span{background:#fff;color:var(--dark);border-radius:999px;padding:1px 9px;font-size:13px}
.ped{background:#fff;border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px}
.ped.novo{border-left-color:#dc2626;animation:pisca 1.2s ease-in-out 6}
.ped.producao{border-left-color:#d97706}
.ped.pronto{border-left-color:#7c3aed}
.ped.saiu{border-left-color:#2563eb}
.ped.nao_entregue{border-left-color:#dc2626;background:#fef2f2}
.saches{background:#fef3c7;border-radius:8px;padding:4px 8px;font-weight:800;font-size:13px;margin:4px 0}
.naoEntregues{background:#fee2e2;border:2px solid #dc2626;border-radius:14px;padding:10px 12px;margin-bottom:12px;animation:pisca 1.2s ease-in-out 4}
.naoEntregues h2{color:#991b1b;font-size:16px;margin:0 0 8px}
.naoEntregues .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.naoEntregues .ped{margin:0}
.ped.entregue{border-left-color:var(--ok);opacity:.75}
.ped.cancelado{border-left-color:#525252;opacity:.6}
@keyframes pisca{50%{background:#fee2e2}}
.ped .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ped .num{font-size:20px;font-weight:900}
.ped .tempo{font-size:12px;color:var(--muted)}
.ped .tempo.atraso{color:#dc2626;font-weight:800}
.ped ul{margin:8px 0;padding-left:18px}
.ped li{margin:2px 0}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0}
.tag.pend{background:#fef3c7;color:#92400e}
.tag.ok{background:#dcfce7;color:#166534}
.tag.info{background:#e0e7ff;color:#3730a3}
.tag.erro{background:#fee2e2;color:#991b1b}
.acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acoes .btn{padding:8px 10px;font-size:13px;border-radius:9px}
.acoes .avancar{flex:1 1 100%}
a.lnk{color:#1d4ed8;font-weight:700;text-decoration:none}
#login{max-width:380px;margin:40px auto}
.agendados{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.agendados h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.agendados .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.agendados .ped{margin:0;border-left-color:#2563eb}
.hora-ag{display:block;background:#1d4ed8;color:#fff;border-radius:8px;padding:5px 8px;margin:6px 0;font-weight:900;font-size:16px;text-align:center}
#futuros{cursor:pointer}
#movimento .btn{padding:4px 8px;font-size:12px;border-radius:7px}
</style>
</head>
<body>
<header class="topo">
  <div class="in">
    <h1>👨‍🍳 Cozinha <span id="relogio" style="font-weight:400;font-size:14px;opacity:.8"></span></h1>
    <div class="ferramentas hide" id="ferramentas">
      <input type="date" id="dataFiltro" style="width:auto;padding:6px;border-radius:8px">
      <label class="toggle" title="Imprime cada pedido novo assim que chegar. Deixe ligado em apenas UM aparelho."><input type="checkbox" id="autoPrint"> 🖨️ Auto-imprimir</label>
      <label class="toggle" title="Abre o WhatsApp com a mensagem pronta para o cliente sempre que mudar a fase"><input type="checkbox" id="autoWhats"> 💬 WhatsApp ao mudar fase</label>
      <span class="toggle" id="movimento" title="Tempo extra na previsão que o cliente vê no acompanhamento"></span>
      <button class="btn sm sec" id="btnSom" onclick="ativarSom()">🔔 Ativar som</button>
      <button class="btn sm sec" id="btnBT" onclick="conectarBT()">🛜 Conectar JP58H</button>
      <a class="btn sm sec" style="text-decoration:none" href="balcao.html" target="_blank">🏪 Balcão</a>
      <a class="btn sm sec" style="text-decoration:none" href="entregador.html" target="_blank">🛵 Entregador</a>
      <a class="btn sm sec" style="text-decoration:none" href="relatorios.html" target="_blank">📊 Gestão</a>
      <button class="btn sm sec hide" id="btnSair" onclick="DB.sair()">Sair</button>
    </div>
  </div>
</header>

<main>
  <div id="avisoDemo" class="aviso hide">⚠️ <b>Modo demonstração:</b> só aparecem pedidos feitos na loja aberta neste mesmo navegador. Configure o Firebase em <code>js/config.js</code>.</div>

  <div id="login" class="card hide">
    <h2>Acesso da cozinha</h2>
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="username">
    <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password">
    <button class="btn full" style="margin-top:14px" onclick="entrar()">Entrar</button>
    <div id="erroLogin" class="muted" style="color:#b91c1c;margin-top:8px"></div>
  </div>

  <div id="painel" class="hide">
    <div id="emergencia" class="hide" style="background:#7f1d1d;color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"></div>
    <div id="futuros" class="aviso hide"></div>
    <a id="avisoInsumos" class="hide" href="relatorios.html#insumos" target="_blank" style="display:inline-block;font-size:13px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:999px;padding:4px 10px;margin:0 0 10px;text-decoration:none"></a>
    <div id="naoEntregues" class="naoEntregues hide"></div>
    <div id="agendados" class="agendados hide"></div>
    <div class="colunas" id="colunas"></div>
  </div>
</main>

<pre id="ticketPrint" class="print-only"></pre>
<div id="toast"></div>

<script src="js/config.js?v=20261025"></script>
<script src="js/cardapio.js?v=20261025"></script>
<script src="js/db.js?v=20261025"></script>
<script src="js/catalogo.js?v=20261025"></script>
<script src="js/ficha.js?v=20261025"></script>
<script src="js/impressora.js?v=20261025"></script>
<script src="js/financeiro.js?v=20261025"></script>
<script>
let pedidos = [];
let conhecidos = null;          // ids já vistos (para alertar pedidos novos)
let fila = [], imprimindo = false, naFila = new Set();
let pararLista = null, pararFuturos = null;
let emEspera = new Set();       // agendados ainda fora da fila (faltam > alertaAntesMin)
let audioCtx = null;
const BOTAO = { producao: '▶️ Iniciar produção', pronto: '📦 Pronto p/ entrega', saiu: '🛵 Saiu para entrega', entregue: '✅ Marcar entregue' };
// Texto do botão principal para ir de p.status à próxima fase
function botaoAvancar(p) {
  const prox = STATUS.proximo(p.status, p.entrega.tipo);
  if (prox === 'saiu' && p.entrega.tipo === 'retirada') return '✅ Pronto p/ retirada';
  if (prox === 'saiu' && p.entrega.tipo === 'balcao') return '✅ Pronto';
  if (prox === 'saiu' && p.status === 'pronto') return '🛵 Saiu (sem rota do entregador)';
  return BOTAO[prox];
}
const ANTES = (CONFIG.horario && CONFIG.horario.alertaAntesMin) || 40;

const pref = (k, padrao) => { const v = localStorage.getItem('cdp_coz_' + k); return v == null ? padrao : v === '1'; };
const setPref = (k, v) => localStorage.setItem('cdp_coz_' + k, v ? '1' : '0');
const elAuto = document.getElementById('autoPrint'), elWa = document.getElementById('autoWhats');
elAuto.checked = pref('autoPrint', false);
elWa.checked = pref('autoWhats', true);
elAuto.onchange = () => { setPref('autoPrint', elAuto.checked); if (elAuto.checked) verificarImpressao(); };
elWa.onchange = () => setPref('autoWhats', elWa.checked);

const elData = document.getElementById('dataFiltro');
elData.value = Horario.dataTurno();   // após a meia-noite continua no dia em que o turno abriu
let dataAuto = true;   // segue o dia do turno até alguém escolher outra data
elData.onchange = () => { dataAuto = elData.value === Horario.dataTurno(); assinar(); };
// Dia do turno muda (horário carregou do Firebase, virada do turno): troca a data sozinha
function seguirDiaDoTurno() {
  const d = Horario.dataTurno();
  if (!dataAuto || elData.value === d) return;
  elData.value = d;
  if (logadoCoz) { assinar(); assinarFuturos(); }
}

if (DB.modo() === 'demo') document.getElementById('avisoDemo').classList.remove('hide');

setInterval(() => {
  document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR').slice(0, 5);
  if (pedidos.length) { liberarAgendados(); render(); verificarImpressao(); }   // atualiza "há X min" e agendados
  publicarFila();   // mantém a fila "viva" para o acompanhamento do cliente
  renderEmergencia();   // "fechar agora" desliga sozinho no dia seguinte
  seguirDiaDoTurno();
}, 30000);
document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR').slice(0, 5);

/* ---------------- LOGIN ---------------- */
DB.observarUsuario(u => {
  if (u && Equipe.de(u.email).papel === 'entregador') return location.replace('entregador.html');
  const logado = !!u;
  document.getElementById('login').classList.toggle('hide', logado);
  document.getElementById('painel').classList.toggle('hide', !logado);
  document.getElementById('ferramentas').classList.toggle('hide', !logado);
  document.getElementById('btnSair').classList.toggle('hide', !logado || DB.modo() === 'demo');
  logadoCoz = logado;
  if (logado) { assinar(); assinarFuturos(); Ficha.iniciar(avisoInsumos); }   // ficha técnica: custo gravado e baixa dos insumos
  else {
    if (pararLista) { pararLista(); pararLista = null; }
    if (pararFuturos) { pararFuturos(); pararFuturos = null; }
  }
});
async function entrar() {
  document.getElementById('erroLogin').textContent = '';
  try { await DB.login(document.getElementById('email').value.trim(), document.getElementById('senha').value); }
  catch (e) { document.getElementById('erroLogin').textContent = 'E-mail ou senha inválidos.'; }
}
document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

/* ---------------- PEDIDOS ---------------- */
async function assinar() {
  if (pararLista) pararLista();
  conhecidos = null;
  pararLista = await DB.observarPedidosDoDia(elData.value, lista => {
    pedidos = lista.sort((a, b) => a.numero - b.numero);
    const ids = new Set(pedidos.map(p => p.id));
    if (conhecidos) {
      const chegaram = pedidos.filter(p => !conhecidos.has(p.id));
      // balcão sem pizza já chega "entregue": não toca alarme
      const novos = chegaram.filter(p => !Horario.emEspera(p) && p.status !== 'entregue'), agend = chegaram.filter(p => Horario.emEspera(p));
      if (novos.length) { tocar(); toast(`🔔 Novo pedido #${novos.map(p => p.numero).join(', #')}`); }
      else if (agend.length) toast(`📅 Novo agendamento #${agend.map(p => p.numero + ' p/ ' + Horario.hora(p.agendadoPara)).join(', #')}`);
    }
    if (!conhecidos) emEspera = new Set(pedidos.filter(p => Horario.emEspera(p)).map(p => p.id));
    conhecidos = ids;
    liberarAgendados();
    render();
    verificarImpressao();
    publicarFila();
  }, e => avisarErro(e));
}

// Agendado que chegou a ANTES min do horário: entra em "Novos" com alarme (e auto-impressão)
function liberarAgendados() {
  const liberados = pedidos.filter(p => emEspera.has(p.id) && !Horario.emEspera(p));
  pedidos.forEach(p => { if (Horario.emEspera(p)) emEspera.add(p.id); });
  liberados.forEach(p => emEspera.delete(p.id));
  const vivos = liberados.filter(p => p.status === 'novo');
  if (vivos.length) { tocar(); toast(`⏰ Agendado #${vivos.map(p => p.numero + ' (' + Horario.hora(p.agendadoPara) + ')').join(', #')} entrou em Novos!`); }
}

/* Agendamentos de dias futuros: aviso para a cozinha saber que existem */
async function assinarFuturos() {
  if (pararFuturos) pararFuturos();
  pararFuturos = await DB.observarPedidosFuturos(Horario.dataTurno(), lista => {
    const porDia = {};
    lista.filter(p => p.status !== 'cancelado').forEach(p => { porDia[p.data] = (porDia[p.data] || 0) + 1; });
    const dias = Object.keys(porDia).sort();
    const el = document.getElementById('futuros');
    el.classList.toggle('hide', !dias.length);
    const total = dias.reduce((s, d) => s + porDia[d], 0);
    el.innerHTML = `📅 <b>${total} pedido${total > 1 ? 's' : ''} agendado${total > 1 ? 's' : ''} para os próximos dias:</b> ` +
      dias.map(d => `<a class="lnk" href="#" onclick="verDia('${d}');return false">${d.slice(8)}/${d.slice(5, 7)} (${porDia[d]})</a>`).join(' • ') +
      ` <span class="muted">— toque na data para ver</span>`;
  });
}
function verDia(d) { elData.value = d; dataAuto = d === Horario.dataTurno(); assinar(); }

function minutos(p) { return Math.floor((Date.now() - p.criadoEm) / 60000); }

function render() {
  // Prontos = entrega aguardando entregador + retirada/balcão prontos; Em rota = entrega com o entregador
  const cols = [
    { id: 'novo', nome: '🆕 Novos', f: p => p.status === 'novo' },
    { id: 'producao', nome: '🔥 Em produção', f: p => p.status === 'producao' },
    { id: 'pronto', nome: '📦 Prontos', f: p => p.status === 'pronto' || (p.status === 'saiu' && p.entrega.tipo !== 'entrega') },
    { id: 'saiu', nome: '🛵 Em rota', f: p => p.status === 'saiu' && p.entrega.tipo === 'entrega' },
    { id: 'entregue', nome: '✅ Entregues', f: p => p.status === 'entregue' || p.status === 'cancelado' }
  ];
  const nao = pedidos.filter(p => p.status === 'nao_entregue');
  const elNao = document.getElementById('naoEntregues');
  elNao.classList.toggle('hide', !nao.length);
  elNao.innerHTML = `<h2>🚨 ${nao.length} pedido${nao.length > 1 ? 's' : ''} NÃO ENTREGUE${nao.length > 1 ? 'S' : ''} — resolver agora</h2><div class="lista">${nao.map(cartao).join('')}</div>`;
  const agend = pedidos.filter(p => Horario.emEspera(p)).sort((a, b) => a.agendadoPara - b.agendadoPara);
  const elAg = document.getElementById('agendados');
  elAg.classList.toggle('hide', !agend.length);
  elAg.innerHTML = `<h2>📅 Agendados <span class="tag info">entram em Novos ${ANTES} min antes</span></h2><div class="lista">${agend.map(cartao).join('')}</div>`;
  document.getElementById('colunas').innerHTML = cols.map(c => {
    let lista = pedidos.filter(p => c.f(p) && !Horario.emEspera(p));
    if (c.id === 'entregue') lista = lista.slice().reverse();
    return `<div class="coluna"><h2>${c.nome}<span>${lista.length}</span></h2>
      ${lista.map(cartao).join('') || '<div class="muted" style="text-align:center;padding:10px">—</div>'}</div>`;
  }).join('');
}

function cartao(p) {
  const e = p.entrega, pg = p.pagamento, min = minutos(p);
  const taxaCalc = Preco.taxa(e);
  const conferido = !!p.consumoInterno || Math.abs(Preco.subtotal(p.itens, p.cortesiaPorPizza || 0) + (taxaCalc || 0) - p.total) < 0.01;
  const sc = Preco.saches(p.itens, p.cortesiaPorPizza || 0);
  const hora = new Date(p.criadoEm).toLocaleTimeString('pt-BR').slice(0, 5);
  const ativo = !['entregue', 'cancelado'].includes(p.status);

  const balcao = e.tipo === 'balcao';
  let pgTag;
  if (pg.forma === 'consumo_interno') pgTag = '<span class="tag erro">🍽️ CONSUMO INTERNO — SEM COBRANÇA</span>';
  else if (pg.forma === 'fiado') pgTag = `<span class="tag pend">📒 FIADO${p.cliente.nome ? ' • ' + esc(p.cliente.nome) : ''} — NÃO COBRAR</span>`;
  else if (balcao) pgTag = `<span class="tag ok">✔ PAGO • ${({ pix: 'PIX', dinheiro: 'DINHEIRO', cartao: 'CARTÃO' })[pg.forma] || pg.forma}${pg.trocoPara ? ' • troco ' + dinheiro(pg.trocoPara - p.total) : ''}</span>`;
  else if (pg.forma === 'pix') pgTag = pg.confirmado ? '<span class="tag ok">PIX ✔ PAGO</span>' : '<span class="tag pend">PIX AGUARDANDO</span>';
  else if (pg.forma === 'dinheiro') pgTag = `<span class="tag info">DINHEIRO${pg.trocoPara ? ' • troco p/ ' + dinheiro(pg.trocoPara) + ' (' + dinheiro(pg.trocoPara - p.total) + ')' : ''}</span>`;
  else pgTag = '<span class="tag info">CARTÃO NA ENTREGA</span>';

  return `<div class="ped ${p.status}">
    <div class="cab"><span class="num">#${p.numero}</span>
      <span class="tempo ${ativo && !p.agendadoPara && min >= 40 ? 'atraso' : ''}">${hora}${ativo && !p.agendadoPara ? ' • há ' + min + ' min' : ''}</span></div>
    ${p.consumoInterno ? `<div class="tag erro" style="font-size:14px;display:block;margin:4px 0">🍽️ CONSUMO INTERNO — SEM COBRANÇA • ${esc(p.consumoInterno.tipoNome || p.consumoInterno.tipo)}${p.consumoInterno.quem ? ': ' + esc(p.consumoInterno.quem) : ''}</div>` : ''}
    ${p.agendadoPara ? `<span class="hora-ag">📅 AGENDADO ${Horario.quando(p.agendadoPara).toUpperCase()} ${Horario.hora(p.agendadoPara)}${ativo ? ` • ${faltam(p)}` : ''}</span>` : ''}
    ${p.cliente.nome || p.cliente.telefone ? `<div><b>${esc(p.cliente.nome)}</b>${p.cliente.telefone ? ` • <a class="lnk" href="tel:${esc(p.cliente.telefone)}">${esc(fone(p.cliente.telefone))}</a>` : ''}</div>` : ''}
    ${balcao ? `<span class="tag info" style="font-size:13px">🏪 BALCÃO • ${e.consumo === 'local' ? '🍽️ Comer aqui' : '🥡 Para levar'}</span>`
    : e.tipo === 'entrega'
      ? `${p.origem === 'balcao' ? '<span class="tag info" style="font-size:13px">🏪 BALCÃO • 🛵 Delivery</span>' : ''}
         <div>📍 ${esc(e.rua)}, ${esc(e.numero)} - ${esc(e.bairro)}${e.complemento ? ' • ' + esc(e.complemento) : ''}</div>
         ${e.referencia ? `<div class="muted">Ref.: ${esc(e.referencia)}</div>` : ''}
         <div class="muted">📏 ${e.distanciaKm != null ? String(e.distanciaKm).replace('.', ',') + ' km' : 'distância não informada'} • entrega ${taxaCalc == null ? '<span class="tag pend">TAXA A COMBINAR</span>' : taxaCalc ? dinheiro(taxaCalc) : 'grátis'}</div>
         ${e.lat ? `<a class="lnk" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}">🗺️ Abrir no mapa</a>` : ''}`
      : '<span class="tag info">🏪 RETIRADA NO BALCÃO</span>'}
    <ul>${p.itens.filter(it => !Preco.ehSache(it)).map(it => `<li><b>${it.qtd}x</b> ${esc(Preco.descricao(it))}${it.obs ? `<br><span class="muted">⚠️ ${esc(it.obs)}</span>` : ''}</li>`).join('')}</ul>
    ${sc.qtd ? `<div class="saches">🥫 SACHÊS (sacola): ${esc(Preco.listaSaches(p.itens))}${sc.gratis ? ` • ${sc.gratis} cortesia` : ''}</div>` : ''}
    ${p.entregador && ['saiu', 'entregue', 'nao_entregue'].includes(p.status) && e.tipo === 'entrega' ? `<div class="muted">🛵 ${esc(p.entregador.nome)}${p.rota && p.rota.ordem ? ` • parada ${p.rota.ordem}` : ''}</div>` : ''}
    ${p.status === 'nao_entregue' && p.naoEntregue ? `<div class="tag erro" style="font-size:13px;display:block;margin:6px 0">❌ NÃO ENTREGUE: ${esc(p.naoEntregue.motivo)}${p.naoEntregue.obs ? ' — ' + esc(p.naoEntregue.obs) : ''}${p.naoEntregue.em ? ' • ' + new Date(p.naoEntregue.em).toLocaleTimeString('pt-BR').slice(0, 5) : ''}</div>` : ''}
    ${p.obs ? `<div class="aviso" style="margin:4px 0">📝 ${esc(p.obs)}</div>` : ''}
    <div><b>Total ${dinheiro(p.total)}</b> ${pgTag}
      ${conferido ? '' : '<span class="tag erro" title="O total enviado não bate com os preços do cardápio">⚠️ CONFERIR VALOR</span>'}
      ${p.impresso ? '' : '<span class="tag pend">NÃO IMPRESSO</span>'}
      ${p.status === 'cancelado' ? '<span class="tag erro">CANCELADO</span>' : ''}</div>
    <div class="acoes">
      ${p.status === 'nao_entregue' ? `<button class="btn avancar" onclick="reenviar('${p.id}')">🔁 Reenviar para entrega</button>`
        : STATUS.proximo(p.status, e.tipo) ? `<button class="btn avancar ${p.status === 'pronto' ? 'sec' : ''}" onclick="mudarStatus('${p.id}','${STATUS.proximo(p.status, e.tipo)}')">${botaoAvancar(p)}</button>` : ''}
      ${pg.forma === 'pix' && ativo && !balcao ? `<button class="btn sm ${pg.confirmado ? 'sec' : 'dark'}" onclick="alternarPix('${p.id}',${!pg.confirmado})">${pg.confirmado ? 'Desfazer Pix' : '💰 Confirmar Pix'}</button>` : ''}
      <button class="btn sm sec" onclick="imprimirManual('${p.id}')">🖨️ Imprimir</button>
      ${p.cliente.telefone ? `<a class="btn sm wa" style="text-decoration:none" target="_blank" href="${linkWhats(p.cliente.telefone, STATUS.mensagem(p, p.status))}">💬 WhatsApp</a>` : ''}
      ${ativo || (p.status === 'entregue' && p.origem === 'balcao' && e.tipo === 'balcao') ? `<button class="btn sm sec" onclick="cancelar('${p.id}')">Cancelar</button>` : ''}
    </div>
  </div>`;
}
function faltam(p) {
  const m = Math.round((p.agendadoPara - Date.now()) / 60000);
  return m >= 60 ? `faltam ${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}` : m >= 0 ? `faltam ${m} min` : `atrasado ${-m} min`;
}
function fone(t) { const d = String(t).replace(/\D/g, ''); return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : t; }
const achar = id => pedidos.find(p => p.id === id);

// Produtos do pedido com estoque insuficiente (avisa, mas deixa continuar — o estoque fica negativo)
function faltasEstoque(p) {
  const qtd = {};
  p.itens.forEach(it => { if (it.tipo === 'produto') qtd[it.id] = (qtd[it.id] || 0) + it.qtd; });
  return Object.keys(qtd).filter(id => { const d = Catalogo.doc(id); return d && d.controlaEstoque && (d.estoqueAtual || 0) < qtd[id]; })
    .map(id => `${Catalogo.doc(id).nome}: pedido ${qtd[id]}, estoque ${Catalogo.doc(id).estoqueAtual || 0}`);
}

async function mudarStatus(id, status, extra) {
  const p = achar(id); if (!p) return;
  if (status === 'producao' && !p.estoqueBaixado) {
    const f = faltasEstoque(p);
    if (f.length && !confirm(`⚠️ Falta estoque no pedido #${p.numero}:\n\n${f.join('\n')}\n\nIniciar produção mesmo assim? (o estoque ficará negativo)`)) return;
  }
  // abre a janela já no clique (navegadores bloqueiam pop-up depois de um await); "pronto" não avisa sozinho
  const jan = elWa.checked && p.cliente.telefone && status !== 'pronto' ? window.open('', '_blank') : null;
  try {
    // pedido do site baixa o estoque ao iniciar a produção (uma única vez); cancelado devolve
    if (status === 'producao') await DB.baixarEstoque(id);
    await DB.atualizarPedido(id, Object.assign({ status }, extra || {}), status);
    if (status === 'cancelado') await DB.estornarEstoque(id);
    // insumos pela ficha técnica: nunca bloqueia a produção (só avisa)
    if (status === 'producao') moverInsumos(id, -1, p.numero);
    if (status === 'cancelado') moverInsumos(id, 1, p.numero);
    if (jan) jan.location.href = linkWhats(p.cliente.telefone, STATUS.mensagem(Object.assign({}, p, { status }), status));
  } catch (e) {
    if (jan) jan.close();
    avisarErro(e);
  }
}
// Baixa (−1) / estorno (+1) dos insumos do pedido pela ficha técnica, em segundo plano
async function moverInsumos(id, sinal, numero) {
  try {
    const r = await (sinal < 0 ? DB.baixarInsumos(id) : DB.estornarInsumos(id));
    if (r.feito && r.semFicha.length) toast(`📋 Pedido #${numero}: sem ficha técnica (${r.semFicha.join(', ')}) — insumos não baixados.`);
  } catch (e) { DB.logErro(e); toast(`Insumos do pedido #${numero} não ${sinal < 0 ? 'baixados' : 'devolvidos'}: ${DB.mensagemErro(e)}`); }
}
// "⚠️ 3 insumos acabando" (link para a Gestão)
function avisoInsumos() {
  const n = Ficha.acabando().length, el = document.getElementById('avisoInsumos');
  el.classList.toggle('hide', !n);
  el.textContent = `⚠️ ${n} insumo${n > 1 ? 's' : ''} acabando — ver na Gestão`;
}
async function alternarPix(id, confirmado) {
  const p = achar(id); if (!p) return;
  if (confirmado && !confirm(`Confirmar que o Pix de ${dinheiro(p.total)} do pedido #${p.numero} CAIU na conta?`)) return;
  await DB.atualizarPedido(id, { pagamento: Object.assign({}, p.pagamento, { confirmado }) });
}
async function cancelar(id) {
  const p = achar(id); if (!p) return;
  if (!confirm(`Cancelar o pedido #${p.numero}${p.cliente.nome ? ' de ' + p.cliente.nome : ''}?`)) return;
  await mudarStatus(id, 'cancelado');
  // fiado / desconto na folha do consumo interno: estorna no financeiro
  if ((p.pagamento.forma === 'fiado' || (p.consumoInterno && p.consumoInterno.descontar)) && window.Fin) {
    try {
      const r = await Fin.estornarPedido(p);
      if (r.fiado) toast(`📒 Fiado do pedido #${p.numero} estornado.`);
      if (r.descontoNaFolha) toast(`⚠️ O desconto do consumo #${p.numero} já está numa folha: ajuste no Caixa.`);
    } catch (e) { DB.logErro(e); toast('Fiado/desconto não estornado: ' + DB.mensagemErro(e)); }
  }
}
// Não entregue → volta para "Pronto" e aparece de novo para o entregador
async function reenviar(id) {
  const p = achar(id); if (!p) return;
  await DB.atualizarPedido(id, { status: 'pronto', entregador: null, rota: null, saiuEm: null }, 'pronto');
  toast(`Pedido #${p.numero} voltou para 📦 Prontos.`);
}

/* ---------------- FILA PÚBLICA + MOVIMENTO (config/fila) ----------------
   Sem dados pessoais: só número, data, status e hora. O acompanhamento do cliente usa para
   "Há N pedidos na sua frente" e a previsão. Se ficar > 10 min sem atualizar, o cliente não vê a fila. */
let logadoCoz = false, filaPublicada = null, filaEm = 0, ajusteMin = 0;
function publicarFila() {
  clearTimeout(publicarFila.t);
  publicarFila.t = setTimeout(async () => {
    if (!logadoCoz || elData.value !== Horario.dataTurno()) return;
    const lista = pedidos.filter(p => ['novo', 'producao', 'pronto', 'saiu'].includes(p.status) && !Horario.emEspera(p))
      .map(p => ({ numero: p.numero, data: p.data, status: p.status, criadoEm: p.criadoEm })).sort((a, b) => a.numero - b.numero);
    const j = JSON.stringify(lista);
    if (j === filaPublicada && Date.now() - filaEm < 4 * 60000) return;   // nada mudou: só um "sinal de vida" a cada 4 min
    try { await DB.salvarFila({ atualizadoEm: Date.now(), pedidos: lista }); filaPublicada = j; filaEm = Date.now(); }
    catch (e) { console.error(e); }
  }, 3000);
}
const MOVIMENTO = [[0, 'Normal'], [15, '+15 min'], [30, '+30 min']];
function renderMovimento() {
  document.getElementById('movimento').innerHTML = '⏱️ Movimento: ' + MOVIMENTO.map(([m, n]) =>
    `<button class="btn sm ${m === ajusteMin ? 'dark' : 'sec'}" onclick="setMovimento(${m})">${n}</button>`).join('');
}
async function setMovimento(m) {
  try { await DB.salvarFila({ ajusteMin: m, atualizadoEm: Date.now() }); toast(m ? `Previsão dos clientes +${m} min.` : 'Previsão normal.'); }
  catch (e) { avisarErro(e); }
}
DB.observarFila(f => { ajusteMin = (f && Number(f.ajusteMin)) || 0; renderMovimento(); });

// estoque e sachês em tempo real (aviso de falta ao iniciar produção)
Catalogo.iniciar(() => { renderEmergencia(); seguirDiaDoTurno(); if (pedidos.length) render(); });

/* ---------------- 🔴 LOJA FECHADA AGORA (ligado na Gestão) ---------------- */
function renderEmergencia() {
  const el = document.getElementById('emergencia'), on = Horario.emergencia();
  el.classList.toggle('hide', !on);
  if (on) el.innerHTML = `<span style="font-size:16px">🔴 <b>Loja online FECHADA agora</b> — clientes só conseguem agendar. ${esc(Horario.textoAgendar())}</span>
    <button class="btn sm sec" onclick="reabrirLoja()">🟢 Reabrir a loja</button>`;
}
async function reabrirLoja() {
  if (!confirm('Reabrir a loja online agora?')) return;
  try { await DB.salvarConfig({ horario: Object.assign({}, Horario.config(), { fechadoAgora: null }) }); toast('🟢 Loja reaberta.'); }
  catch (e) { avisarErro(e); }
}

/* ---------------- IMPRESSÃO ---------------- */
function verificarImpressao() {
  if (!elAuto.checked) return;
  pedidos.filter(p => p.status === 'novo' && !p.impresso && !naFila.has(p.id) && !Horario.emEspera(p)).forEach(p => { naFila.add(p.id); fila.push(p.id); });
  processarFila();
}
async function processarFila() {
  if (imprimindo) return;
  imprimindo = true;
  while (fila.length) {
    const id = fila.shift(), p = achar(id);
    if (p && !p.impresso && !Horario.emEspera(p)) {
      try { await Impressora.imprimir(p); await DB.atualizarPedido(id, { impresso: true }); }
      catch (e) { console.error(e); toast('Falha ao imprimir #' + p.numero); naFila.delete(id); }
    }
  }
  imprimindo = false;
}
async function imprimirManual(id) {
  const p = achar(id); if (!p) return;
  await Impressora.imprimir(p);
  if (!p.impresso) await DB.atualizarPedido(id, { impresso: true });
}
async function conectarBT() {
  try {
    const nome = await Impressora.conectar();
    const b = document.getElementById('btnBT'); b.textContent = '🟢 ' + nome; b.classList.remove('sec'); b.classList.add('dark');
    toast('Impressora conectada!');
  } catch (e) { toast(e.message || 'Falha ao conectar.'); }
}

/* ---------------- SOM ---------------- */
function ativarSom() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  tocar();
  const b = document.getElementById('btnSom'); b.textContent = '🔔 Som ligado'; b.classList.remove('sec'); b.classList.add('dark');
}
function tocar() {
  if (!audioCtx) return;
  [0, 0.25, 0.5].forEach(t => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.4, audioCtx.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
    o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
  });
}

// Erro ao gravar: mensagem clara (funciona mesmo se o db.js em cache for de outra versão)
function avisarErro(e) {
  if (window.DB && DB.mensagemErro) { DB.logErro(e); toast(DB.mensagemErro(e)); return; }
  console.error(e); toast('Página desatualizada: aperte Ctrl+F5 (no celular, feche e abra o navegador).');
}
function toast(t) {
  const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3500);
}
</script>
